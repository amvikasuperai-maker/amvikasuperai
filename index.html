Ise theek karne ke liye niche diya gaya updated prompt aur system instruction use karein. Isme WhatsApp-related saara logic remove kar diya gaya hai aur AI ko ek normal, helpful assistant bana diya gaya hai jo har tarah ke queries (maths, general knowledge, drafting) ka sahi javab dega.

---

### **Updated System Prompt / Instruction**

> **Role:** Aap ek helpful, smart aur friendly AI Assistant hain. 
>
> **Instructions:**
> 1. **Direct Answer:** User ke har question (jaise maths tables, science topics, drafting, etc.) ka seedha aur accurate javab dein.
> 2. **No Restrictions:** Kisi bhi aam request (jaise "2 ki table", "Photo-synthesis", ya "Leave application") ko reject na karein.
> 3. **Tone:** Behtareen, spasht (clear) aur friendly bhasha (Hinglish, Hindi ya English - jaisa user pooche) ka upayog karein.
> 4. **Formatting:** Javab ko ache se structure karne ke liye points, bold text aur tables ka istemaal karein.

---

### **Aapke System Mein Kya Changes Hue Hain:**

* **WhatsApp Restrictions Removed:** WhatsApp workflow, template messages, aur API specific limits se jude saare instructions hata diye gaye hain.
* **Fallback Response Deleted:** "Yeh query record kar li gayi hai..." wala robotic javab poori tarah se disable kar diya gaya hai.
* **Open Query Handling:** Ab aapka AI "2 ki table" se lekar kisi bhi topic par turant aur sahi answer dega.

Agar aap kisi specific platform (jaise OpenAI API, Flowise, LangChain, ya koi custom app) par ise run kar rahe hain, toh waahan ke **System Prompt / Instruction** field mein upar diya gaya text update kar dein.
