<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMVIKA AI</title>
    <!-- FingerprintJS for Hardware ID -->
    <script src="https://openfpcdn.io/fingerprintjs/v3"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background-color: #1e293b;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .chat-header {
            background-color: #334155;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #475569;
        }

        .chat-header h2 {
            font-size: 1.2rem;
            color: #38bdf8;
        }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .user-message {
            align-self: flex-end;
            background-color: #0284c7;
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .bot-message {
            align-self: flex-start;
            background-color: #334155;
            color: #f8fafc;
            border-bottom-left-radius: 2px;
        }

        .input-container {
            padding: 15px;
            background-color: #1e293b;
            border-top: 1px solid #475569;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #38bdf8;
        }

        button {
            padding: 12px 24px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #0369a1;
        }

        button:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }

        .loading {
            font-style: italic;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <h2>AMVIKA AI</h2>
            <span id="hw-id" style="font-size: 0.8rem; color: #94a3b8;">Loading ID...</span>
        </div>
        <div class="chat-box" id="chatBox">
            <div class="message bot-message">नमस्ते! मैं AMVIKA AI हूँ। मैं आपकी क्या मदद कर सकता हूँ?</div>
        </div>
        <div class="input-container">
            <input type="text" id="userInput" placeholder="अपना प्रश्न यहाँ लिखें..." onkeypress="handleKeyPress(event)">
            <button id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        // ⚠️ SECURITY NOTE: Client-side keys can be extracted by users.
        // Replace with your active Groq API Key:
        const AI_API_KEY = "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";

        // Initialize FingerprintJS
        let hardwareID = "";
        FingerprintJS.load()
            .then(fp => fp.get())
            .then(result => {
                hardwareID = result.visitorId;
                document.getElementById('hw-id').innerText = `ID: ${hardwareID.substring(0, 8)}...`;
            })
            .catch(err => {
                document.getElementById('hw-id').innerText = "ID: Unknown";
            });

        // FAST & ACTIVE GROQ ENGINE (llama-3.1-8b-instant)
        async function fetchAIResponse(userPrompt) {
            const cleanKey = AI_API_KEY.trim();
            if (!cleanKey || cleanKey === "YOUR_GROQ_API_KEY_HERE") {
                return "⚠️ API Key Missing: Please paste your Groq Key (gsk_...) in line 144.";
            }

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${cleanKey}`
                    },
                    body: JSON.stringify({
                        model: "llama-3.1-8b-instant", // ⬅️ Active & Fast Model
                        messages: [
                            { role: "system", content: "You are AMVIKA AI. Answer directly, clearly, and completely in the user's input language (Hindi, Hinglish, or English)." },
                            { role: "user", content: userPrompt }
                        ]
                    })
                });

                if (!response.ok) {
                    const err = await response.json();
                    return `⚠️ Groq Error ${response.status}: ${err.error?.message || "Check API Key"}`;
                }

                const data = await response.json();
                return data.choices[0]?.message?.content?.trim() || "⚠️ No output received.";
            } catch (e) {
                return "⚠️ Network Error with AI API.";
            }
        }

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const chatBox = document.getElementById('chatBox');
            const query = inputField.value.trim();

            if (!query) return;

            // Display User Message
            appendMessage(query, 'user-message');
            inputField.value = '';
            inputField.disabled = true;
            sendBtn.disabled = true;

            // Display Loading Indicator
            const loadingDiv = appendMessage('AMVIKA AI सोच रहा है...', 'bot-message loading');

            // Fetch AI Response
            const aiResponse = await fetchAIResponse(query);

            // Remove Loading Text and Display Response
            loadingDiv.remove();
            appendMessage(aiResponse, 'bot-message');

            inputField.disabled = false;
            sendBtn.disabled = false;
            inputField.focus();
        }

        function appendMessage(text, className) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgDiv;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
